name: Unit Tests for JDK17
on:
  schedule:
    - cron: "0 23 * * *"

permissions: write-all

jobs:
  test-yarn:
    runs-on: redhat8-builds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: feature/jdk17_upgrade
      - name: Test
        run: ./start-build-env.sh ubuntu_24 cloudera/ut.sh hadoop-yarn-project
  test-hdfs:
    runs-on: redhat8-builds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: feature/jdk17_upgrade
      - name: Test
        run: ./start-build-env.sh ubuntu_24 cloudera/ut.sh hadoop-hdfs-project
  test-common:
    runs-on: redhat8-builds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: feature/jdk17_upgrade
      - name: Test
        run: ./start-build-env.sh ubuntu_24 cloudera/ut.sh hadoop-common-project
  test-mapreduce:
    runs-on: redhat8-builds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: feature/jdk17_upgrade
      - name: Test
        run: ./start-build-env.sh ubuntu_24 cloudera/ut.sh hadoop-mapreduce-project
