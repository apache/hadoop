# Runs tests that cover IPv6 code paths under the ipv6-test Maven profile,
# which lets the test JVM use IPv6 (the default build pins it to IPv4).
# Only IPv6 loopback (::1) is needed, so hosted runners without outbound
# IPv6 work.
name: "IPv6"

on:
  pull_request:
    paths:
      - '.github/workflows/ipv6.yml'
      - 'hadoop-project/pom.xml'
      - 'hadoop-common-project/hadoop-common/**'
      - 'hadoop-hdfs-project/hadoop-hdfs-client/**'
      - 'hadoop-hdfs-project/hadoop-hdfs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipv6-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress -Dmaven.test.failure.ignore=false
  MODULES: -pl :hadoop-common -pl :hadoop-hdfs-client -pl :hadoop-hdfs
  # Tests known to pass on an IPv6 preferring JVM. Each class name matches only in the module
  # that defines it. Most MiniDFSCluster tests do not pass yet: DataNodes bind 127.0.0.1 by
  # default but register with the NameNode as ::1.
  TESTS: TestDNS,TestMachineList,TestLoadBalancingKMSClientProvider,TestDatanodeID,TestDefaultNameNodePort,TestMiniDFSCluster#testBindHostIPv6Loopback,TestClientNameNodeAddress,TestDFSUtil,TestGetConf,TestDatanodeManager

jobs:
  test:
    name: IPv6 tests (Java 17)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: 'maven'
      - name: Build
        run: ./mvnw $MAVEN_ARGS $MODULES -am install -DskipTests
      - name: Test
        run: ./mvnw $MAVEN_ARGS $MODULES -Pipv6-test --fail-at-end test -Dtest="$TESTS" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ipv6-test-logs
          path: |
            **/target/**/*.log
            **/target/surefire-reports/**
