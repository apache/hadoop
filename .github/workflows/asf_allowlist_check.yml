# Fails when a `uses:` ref under .github/ is not on the ASF allowlist, and
# warns when an allowlisted pin is about to expire. Without it, a disallowed
# or expired pin shows up only as a log-less "startup_failure" in apache/hadoop
# (forks are not subject to the allowlist, so fork runs stay green).
# The weekly schedule catches pins that ASF expires between changes.

name: "ASF Allowlist Check"

# Security: this workflow only reads the repository; it never runs code from
# the checked-out tree and holds a read-only token.
on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - trunk
    paths:
      - ".github/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asf-allowlist-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    if: github.event_name != 'schedule' || github.repository == 'apache/hadoop'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: apache/infrastructure-actions/allowlist-check@47b297bbe90f580139129bee531bd84bd95b7f5d # allowlist-check/v1.0.4
