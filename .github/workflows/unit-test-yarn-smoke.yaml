name: Unit Tests Yarn Smoke
on:
  pull_request:
    branches:
      - cdh_main

permissions: write-all

jobs:
  build:
    name: Unit Tests Yarn Smoke
    runs-on: redhat8-builds
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Build
        env:
          USER: "jenkins"
          DOCKER_INTERACTIVE_RUN: ""
        run: ./start-build-env.sh ubuntu_24 cloudera/unit-tests-yarn-smoke.sh
